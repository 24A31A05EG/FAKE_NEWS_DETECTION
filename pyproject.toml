[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FAKE_NEWS_DETECTION"
version = "0.1.0"
description = "NLP and ML/DL fake news detection system with input validation, evidence retrieval, automated testing, and Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "scikit-learn>=1.6.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "nltk>=3.9.0",
    "joblib>=1.4.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.40.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.3",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
dl = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]
